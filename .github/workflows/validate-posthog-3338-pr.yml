name: Validate PostHog #3338 PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  react-native:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint React Native package
        run: pnpm --filter=posthog-react-native lint

      - name: Build React Native dependency graph
        run: pnpm --filter=posthog-react-native... build

      - name: Test React Native package
        run: pnpm --filter=posthog-react-native test
